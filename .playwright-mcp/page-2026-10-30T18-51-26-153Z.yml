        - generic [ref=e43]:
          - generic [ref=e44]:
            - heading "1. Overview & Operating Status" [level=2] [ref=e45]
            - paragraph [ref=e46]: TapH5 Games ("we", "our", or "platform") respects player privacy and data protection principles. Our platform is architected around player safety, data minimization, and transparent controls.
            - paragraph [ref=e47]:
              - emphasis [ref=e48]:
                - text: "Current Status: Commercial advertising technologies are inactive by default ("
                - code [ref=e49]: ADS_ENABLED=false
                - text: ). No third-party marketing tags or ad tracking pixels execute during default portal operation.
          - generic [ref=e50]:
            - heading "2. Information Collection & First-Party Analytics" [level=2] [ref=e51]
            - paragraph [ref=e52]: We do not require mandatory registration or personal accounts for public game discovery and gameplay. Standard web server logs (including truncated IP addresses and user agents) are processed strictly for security, rate limiting, and operational diagnostics.
            - paragraph [ref=e53]:
              - text: To measure portal engagement, game loads, and play sessions, we utilize a privacy-conscious, first-party analytics system. This system relies on rotating pseudonymized visitor identifiers (
              - code [ref=e54]: taph5_vid
              - text: ) and ephemeral session tokens. We do not track individual users across unrelated websites, do not construct behavioral profiles, and never sell or rent user data.
          - generic [ref=e55]:
            - heading "3. Game Sandbox & Origin Isolation" [level=2] [ref=e56]
            - paragraph [ref=e57]:
              - text: Every game hosted on our portal runs within an isolated, sandboxed HTML5 frame (
              - code [ref=e58]: sandbox="allow-scripts allow-forms allow-pointer-lock"
              - text: ). Under no circumstances is
              - code [ref=e59]: allow-same-origin
              - text: granted. This technical barrier guarantees that game scripts cannot access parent cookies, local storage, session state, or credentials.
          - generic [ref=e60]:
            - heading "4. Third-Party Advertising & Google Certified CMP" [level=2] [ref=e61]
            - paragraph [ref=e62]: To sustainably offer free web games, TapH5 Games is architecturally prepared for approved advertising partners including Google AdSense and H5 Games Ads (Google Ad Placement API).
            - paragraph [ref=e63]: "When commercial advertising is activated:"
            - list [ref=e64]:
              - listitem [ref=e65]: Advertisers may use cookies or mobile advertising IDs to serve contextual or personalized advertisements and prevent fraudulent traffic.
              - listitem [ref=e66]: For users within the European Economic Area (EEA), the United Kingdom, and Switzerland, Google requires an IAB Europe Transparency and Consent Framework (TCF v2.2) certified Consent Management Platform (CMP). Our platform prepares integration with Google's certified Privacy & Messaging CMP to ensure valid, auditable consent strings are communicated before ad scripts load.
              - listitem [ref=e67]: H5 Games Ads and interstitial ad breaks run within individual game canvas documents subject to approved developer SDK integration.
          - generic [ref=e68]:
            - heading "5. Privacy Rights & Consent Management" [level=2] [ref=e69]
            - paragraph [ref=e70]: Where regional privacy regulations (including GDPR, UK GDPR, and CCPA) apply, non-essential advertising scripts remain blocked until explicit consent is granted. You can review, adjust, or revoke your consent preferences at any time by selecting the "Cookie & Ad Preferences" link located in our footer.
