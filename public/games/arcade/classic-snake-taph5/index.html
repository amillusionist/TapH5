<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Classic Snake - TapH5</title>
  <style>
    :root {
      --lcd-bg: #9bbc0f;
      --lcd-dark: #0f380f;
      --lcd-accent: #306230;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      background-color: #0b0e14;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: monospace;
      padding: 12px;
      overflow: hidden;
    }

    .game-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 400px;
    }

    .header-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--lcd-bg);
      border: 3px solid var(--lcd-dark);
      border-bottom: none;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 900;
      color: var(--lcd-dark);
      border-radius: 8px 8px 0 0;
    }

    .header-bar button {
      background: var(--lcd-dark);
      color: var(--lcd-bg);
      border: none;
      padding: 5px 10px;
      font-family: inherit;
      font-size: 11px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }

    .canvas-container {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: var(--lcd-bg);
      border: 3px solid var(--lcd-dark);
      border-radius: 0 0 8px 8px;
      touch-action: none;
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .touch-hint {
      margin-top: 14px;
      color: #94a3b8;
      font-size: 12px;
      text-align: center;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="game-wrapper">
    <div class="header-bar">
      <span id="score-display">SCORE: 0</span>
      <span id="speed-display">SPD: 1.0x</span>
      <span id="hi-display">HI: 0</span>
      <button id="sound-toggle">AUDIO: ON</button>
    </div>

    <div class="canvas-container" id="touch-surface">
      <canvas id="gameCanvas" width="320" height="320"></canvas>
    </div>

    <div class="touch-hint">Swipe anywhere to steer • Tap to restart</div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const touchSurface = document.getElementById('touch-surface');
    const scoreDisplay = document.getElementById('score-display');
    const speedDisplay = document.getElementById('speed-display');
    const hiDisplay = document.getElementById('hi-display');
    const soundToggle = document.getElementById('sound-toggle');

    const TILE_COUNT = 20;
    const GRID_SIZE = canvas.width / TILE_COUNT;

    const COLOR_DARK = '#0f380f';
    const COLOR_LIGHT = '#9bbc0f';
    const COLOR_ACCENT = '#306230';

    // Speed Balancing Variables (Higher ms = Slower Movement)
    const BASE_DELAY = 210; // Shuruat bilkul steady aur relaxed pace me hogi
    const MIN_DELAY = 105;  // Maximum fast limit - player aaram se react kar sakega
    const SPEED_STEP = 1.8; // Har fruit khane par speed dheere-dheere badhegi

    let snake = [];
    let velocity = { x: 0, y: -1 };
    let nextVelocity = { x: 0, y: -1 };
    let food = { x: 0, y: 0 };
    let score = 0;
    let foodEaten = 0;
    function safeGetItem(key) {
      try {
        return window.localStorage ? window.localStorage.getItem(key) : null;
      } catch (e) {
        return null;
      }
    }
    function safeSetItem(key, val) {
      try {
        if (window.localStorage) window.localStorage.setItem(key, val);
      } catch (e) {}
    }
    let highScore = parseInt(safeGetItem('taph5_snake_hi')) || 0;
    let isGameOver = false;
    let soundEnabled = true;
    let gameLoopTimeout = null;

    hiDisplay.textContent = `HI: ${highScore}`;

    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) audioCtx = new AudioContextClass();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playBeep(freq, duration, type = 'square') {
      if (!soundEnabled) return;
      try {
        const ctxNode = getAudioContext();
        const osc = ctxNode.createOscillator();
        const gain = ctxNode.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctxNode.currentTime);
        gain.gain.setValueAtTime(0.06, ctxNode.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctxNode.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctxNode.destination);
        osc.start();
        osc.stop(ctxNode.currentTime + duration);
      } catch (e) {}
    }

    function calculateCurrentDelay() {
      return Math.max(MIN_DELAY, Math.round(BASE_DELAY - (foodEaten * SPEED_STEP)));
    }

    function updateSpeedIndicator() {
      const currentDelay = calculateCurrentDelay();
      const multiplier = (BASE_DELAY / currentDelay).toFixed(1);
      speedDisplay.textContent = `SPD: ${multiplier}x`;
    }

    function initGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 10, y: 11 },
        { x: 10, y: 12 }
      ];
      velocity = { x: 0, y: -1 };
      nextVelocity = { x: 0, y: -1 };
      score = 0;
      foodEaten = 0;
      isGameOver = false;
      scoreDisplay.textContent = `SCORE: 0`;
      updateSpeedIndicator();
      spawnFood();
      clearTimeout(gameLoopTimeout);
      tick();
    }

    function spawnFood() {
      let valid = false;
      while (!valid) {
        food.x = Math.floor(Math.random() * TILE_COUNT);
        food.y = Math.floor(Math.random() * TILE_COUNT);
        valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
      }
    }

    function update() {
      velocity = { ...nextVelocity };

      const head = {
        x: snake[0].x + velocity.x,
        y: snake[0].y + velocity.y
      };

      if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
        gameOver();
        return;
      }

      for (let i = 0; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          gameOver();
          return;
        }
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        foodEaten += 1;
        scoreDisplay.textContent = `SCORE: ${score}`;
        updateSpeedIndicator();
        playBeep(880, 0.08);

        if (score > highScore) {
          highScore = score;
          safeSetItem('taph5_snake_hi', highScore);
          hiDisplay.textContent = `HI: ${highScore}`;
        }
        spawnFood();
      } else {
        snake.pop();
      }
    }

    function drawRoundedRect(x, y, w, h, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + w - radius, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
      ctx.lineTo(x + w, y + h - radius);
      ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
      ctx.lineTo(x + radius, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
      ctx.fill();
    }

    function render() {
      ctx.fillStyle = COLOR_LIGHT;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const fx = food.x * GRID_SIZE + GRID_SIZE / 2;
      const fy = food.y * GRID_SIZE + GRID_SIZE / 2;
      const fruitRadius = (GRID_SIZE / 2) - 2;

      ctx.fillStyle = COLOR_DARK;
      ctx.beginPath();
      ctx.arc(fx, fy, fruitRadius, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = COLOR_LIGHT;
      ctx.beginPath();
      ctx.arc(fx - 2, fy - 2, 2, 0, Math.PI * 2);
      ctx.fill();

      snake.forEach((part, index) => {
        const px = part.x * GRID_SIZE;
        const py = part.y * GRID_SIZE;
        const pad = 1.5;
        const size = GRID_SIZE - (pad * 2);

        if (index === 0) {
          ctx.fillStyle = COLOR_DARK;
          drawRoundedRect(px + pad, py + pad, size, size, size / 2.2);

          ctx.fillStyle = COLOR_LIGHT;
          let eye1 = { x: 0, y: 0 };
          let eye2 = { x: 0, y: 0 };

          if (velocity.x === 1) {
            eye1 = { x: px + size - 2, y: py + 4 };
            eye2 = { x: px + size - 2, y: py + size - 2 };
          } else if (velocity.x === -1) {
            eye1 = { x: px + 4, y: py + 4 };
            eye2 = { x: px + 4, y: py + size - 2 };
          } else if (velocity.y === 1) {
            eye1 = { x: px + 4, y: py + size - 2 };
            eye2 = { x: px + size - 2, y: py + size - 2 };
          } else {
            eye1 = { x: px + 4, y: py + 4 };
            eye2 = { x: px + size - 2, y: py + 4 };
          }

          ctx.beginPath();
          ctx.arc(eye1.x, eye1.y, 1.8, 0, Math.PI * 2);
          ctx.arc(eye2.x, eye2.y, 1.8, 0, Math.PI * 2);
          ctx.fill();

        } else if (index === snake.length - 1) {
          ctx.fillStyle = COLOR_ACCENT;
          const tailPad = 3;
          drawRoundedRect(px + tailPad, py + tailPad, GRID_SIZE - (tailPad * 2), GRID_SIZE - (tailPad * 2), 6);
        } else {
          ctx.fillStyle = COLOR_DARK;
          drawRoundedRect(px + pad, py + pad, size, size, 5);

          ctx.fillStyle = COLOR_LIGHT;
          drawRoundedRect(px + 4, py + 4, GRID_SIZE - 8, GRID_SIZE - 8, 3);
        }
      });

      if (isGameOver) {
        ctx.fillStyle = 'rgba(155, 188, 15, 0.95)';
        ctx.fillRect(20, 100, canvas.width - 40, 95);
        ctx.strokeStyle = COLOR_DARK;
        ctx.lineWidth = 2.5;
        ctx.strokeRect(20, 100, canvas.width - 40, 95);

        ctx.fillStyle = COLOR_DARK;
        ctx.font = 'bold 20px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, 138);
        ctx.font = '12px monospace';
        ctx.fillText('TAP TO RETRY', canvas.width / 2, 166);
      }
    }

    function gameOver() {
      isGameOver = true;
      playBeep(180, 0.35, 'sawtooth');
      render();
    }

    function tick() {
      if (!isGameOver) {
        update();
        render();
        const currentSpeed = calculateCurrentDelay();
        gameLoopTimeout = setTimeout(tick, currentSpeed);
      }
    }

    function setDirection(x, y) {
      if (isGameOver) {
        initGame();
        return;
      }
      if (x !== 0 && velocity.x === -x) return;
      if (y !== 0 && velocity.y === -y) return;

      nextVelocity = { x, y };
      playBeep(480, 0.02);
    }

    let touchStartX = 0;
    let touchStartY = 0;
    const SWIPE_THRESHOLD = 20;

    touchSurface.addEventListener('touchstart', (e) => {
      const touch = e.touches[0];
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
    }, { passive: true });

    touchSurface.addEventListener('touchmove', (e) => {
      e.preventDefault();
    }, { passive: false });

    touchSurface.addEventListener('touchend', (e) => {
      if (isGameOver) {
        initGame();
        return;
      }

      const touch = e.changedTouches[0];
      const deltaX = touch.clientX - touchStartX;
      const deltaY = touch.clientY - touchStartY;

      if (Math.abs(deltaX) < SWIPE_THRESHOLD && Math.abs(deltaY) < SWIPE_THRESHOLD) return;

      if (Math.abs(deltaX) > Math.abs(deltaY)) {
        if (deltaX > 0) setDirection(1, 0);
        else setDirection(-1, 0);
      } else {
        if (deltaY > 0) setDirection(0, 1);
        else setDirection(0, -1);
      }
    }, { passive: true });

    window.addEventListener('keydown', (e) => {
      switch (e.key) {
        case 'ArrowUp':
        case 'KeyW':
          e.preventDefault();
          setDirection(0, -1);
          break;
        case 'ArrowDown':
        case 'KeyS':
          e.preventDefault();
          setDirection(0, 1);
          break;
        case 'ArrowLeft':
        case 'KeyA':
          e.preventDefault();
          setDirection(-1, 0);
          break;
        case 'ArrowRight':
        case 'KeyD':
          e.preventDefault();
          setDirection(1, 0);
          break;
        case 'Enter':
        case 'Space':
          if (isGameOver) initGame();
          break;
      }
    });

    soundToggle.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundToggle.textContent = `AUDIO: ${soundEnabled ? 'ON' : 'OFF'}`;
    });

    initGame();
  </script>
</body>
</html>
