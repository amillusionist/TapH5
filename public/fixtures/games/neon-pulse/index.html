<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Pulse - Technical Test Fixture</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090d16;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }
    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }
    .hud {
      position: absolute;
      top: 16px;
      left: 16px;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .title {
      font-size: 14px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #10b981;
      font-weight: 700;
    }
    .score {
      font-size: 28px;
      font-weight: 900;
      color: #38bdf8;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
    }
    .instructions {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      color: #94a3b8;
      background: rgba(15, 23, 42, 0.8);
      padding: 6px 14px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="title">Technical Test Fixture</div>
    <div class="score" id="scoreDisplay">Score: 0</div>
  </div>
  <div class="instructions">Click or Tap anywhere to pulse energy</div>
  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('scoreDisplay');

    let width = 0;
    let height = 0;
    let score = 0;
    const particles = [];
    const ripples = [];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.alpha = 1;
        this.decay = Math.random() * 0.02 + 0.015;
        this.size = Math.random() * 3 + 2;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
        this.size *= 0.98;
      }
      draw(c) {
        c.save();
        c.globalAlpha = Math.max(0, this.alpha);
        c.fillStyle = this.color;
        c.shadowColor = this.color;
        c.shadowBlur = 10;
        c.beginPath();
        c.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        c.fill();
        c.restore();
      }
    }

    class Ripple {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.radius = 5;
        this.maxRadius = 60;
        this.alpha = 1;
      }
      update() {
        this.radius += 3;
        this.alpha = 1 - (this.radius / this.maxRadius);
      }
      draw(c) {
        c.save();
        c.globalAlpha = Math.max(0, this.alpha);
        c.strokeStyle = this.color;
        c.lineWidth = 2;
        c.shadowColor = this.color;
        c.shadowBlur = 8;
        c.beginPath();
        c.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        c.stroke();
        c.restore();
      }
    }

    const colors = ['#10b981', '#06b6d4', '#8b5cf6', '#f59e0b', '#ec4899'];

    function createPulse(x, y) {
      score += 10;
      scoreDisplay.textContent = 'Score: ' + score;
      const color = colors[Math.floor(Math.random() * colors.length)];
      ripples.push(new Ripple(x, y, color));
      for (let i = 0; i < 24; i++) {
        particles.push(new Particle(x, y, color));
      }
    }

    window.addEventListener('pointerdown', (e) => {
      createPulse(e.clientX, e.clientY);
    });

    let centerAngle = 0;

    function loop() {
      ctx.fillStyle = 'rgba(9, 13, 22, 0.2)';
      ctx.fillRect(0, 0, width, height);

      // Central glowing orb
      centerAngle += 0.03;
      const pulseSize = 24 + Math.sin(centerAngle * 2) * 6;
      const cx = width / 2;
      const cy = height / 2;

      ctx.save();
      ctx.fillStyle = '#10b981';
      ctx.shadowColor = '#10b981';
      ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.arc(cx, cy, pulseSize, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Update and draw ripples
      for (let i = ripples.length - 1; i >= 0; i--) {
        ripples[i].update();
        ripples[i].draw(ctx);
        if (ripples[i].alpha <= 0) {
          ripples.splice(i, 1);
        }
      }

      // Update and draw particles
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw(ctx);
        if (particles[i].alpha <= 0) {
          particles.splice(i, 1);
        }
      }

      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
