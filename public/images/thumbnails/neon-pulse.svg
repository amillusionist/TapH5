<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#02140e"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <circle cx="200" cy="140" r="80" fill="none" stroke="#10b981" stroke-width="2" opacity="0.2"/>
  <circle cx="200" cy="140" r="55" fill="none" stroke="#34d399" stroke-width="3" opacity="0.4"/>
  <circle cx="200" cy="140" r="30" fill="#10b981" filter="url(#glow)"/>
  <circle cx="200" cy="140" r="14" fill="#a7f3d0"/>
  <!-- Sparkles -->
  <circle cx="140" cy="90" r="4" fill="#6ee7b7" filter="url(#glow)"/>
  <circle cx="260" cy="100" r="3" fill="#6ee7b7" filter="url(#glow)"/>
  <circle cx="280" cy="180" r="5" fill="#34d399" filter="url(#glow)"/>
  <circle cx="120" cy="190" r="3" fill="#10b981" filter="url(#glow)"/>
  <text x="200" y="250" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" letter-spacing="2">NEON PULSE</text>
  <text x="200" y="272" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" letter-spacing="1">ARCADE • ACTION</text>
</svg>

