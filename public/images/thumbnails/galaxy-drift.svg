<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <ellipse cx="200" cy="140" rx="90" ry="35" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#glow)" transform="rotate(-20 200 140)"/>
  <circle cx="200" cy="140" r="35" fill="#f59e0b" filter="url(#glow)"/>
  <text x="200" y="255" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="800" font-size="20" letter-spacing="2">GALAXY DRIFT</text>
  <text x="200" y="275" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="600" font-size="11" letter-spacing="1">RACING • SPACE</text>
</svg>

