<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <radialGradient id="snake-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#143814"/>
      <stop offset="60%" stop-color="#0a1f0a"/>
      <stop offset="100%" stop-color="#051005"/>
    </radialGradient>
    <filter id="lcd-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#snake-bg)"/>
  
  <!-- Retro LCD Screen Border -->
  <rect x="60" y="30" width="280" height="190" rx="10" fill="#9bbc0f" stroke="#0f380f" stroke-width="6"/>
  <rect x="70" y="40" width="260" height="170" fill="#8bac0f"/>
  
  <!-- Subtle pixel grid -->
  <path d="M70 74 h260 M70 108 h260 M70 142 h260 M70 176 h260" stroke="#79990e" stroke-width="1" opacity="0.4"/>
  <path d="M104 40 v170 M138 40 v170 M172 40 v170 M206 40 v170 M240 40 v170 M274 40 v170 M308 40 v170" stroke="#79990e" stroke-width="1" opacity="0.4"/>

  <!-- Snake Body Pixels (Nokia LCD Dark Green/Black) -->
  <rect x="110" y="140" width="18" height="18" rx="2" fill="#0f380f"/>
  <rect x="132" y="140" width="18" height="18" rx="2" fill="#0f380f"/>
  <rect x="154" y="140" width="18" height="18" rx="2" fill="#0f380f"/>
  <rect x="176" y="140" width="18" height="18" rx="2" fill="#0f380f"/>
  <rect x="198" y="140" width="18" height="18" rx="2" fill="#0f380f"/>
  <rect x="198" y="118" width="18" height="18" rx="2" fill="#0f380f"/>
  <rect x="198" y="96" width="18" height="18" rx="2" fill="#0f380f"/>
  <rect x="220" y="96" width="18" height="18" rx="2" fill="#0f380f"/>
  <rect x="242" y="96" width="18" height="18" rx="2" fill="#0f380f"/>
  <!-- Snake Head with eye dots -->
  <rect x="264" y="96" width="18" height="18" rx="3" fill="#0f380f"/>
  <circle cx="277" cy="101" r="2.5" fill="#8bac0f"/>
  <circle cx="277" cy="109" r="2.5" fill="#8bac0f"/>

  <!-- Food Pellet -->
  <rect x="264" y="140" width="18" height="18" rx="3" fill="#0f380f"/>
  <circle cx="273" cy="149" r="3" fill="#8bac0f"/>

  <!-- Titles -->
  <text x="200" y="254" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="19" letter-spacing="2">CLASSIC SNAKE</text>
  <text x="200" y="276" text-anchor="middle" fill="#a3e635" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" letter-spacing="1">ARCADE • RETRO 3310</text>
</svg>

